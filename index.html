<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보글보글 냠냠수첩</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream: #FFF8EE;
    --pot: #E8734A;
    --pot-dark: #C85A34;
    --leaf: #7B9E5E;
    --ink: #3D2E22;
    --paper: #FFFFFF;
    --note: #FFE8A3;
    --line: #EFE1CC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--cream);
    color: var(--ink);
    background-image: radial-gradient(circle, #F0E4CE 1px, transparent 1px);
    background-size: 18px 18px;
  }
  header {
    padding: 22px 20px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  header .steam {
    display: inline-block;
    animation: rise 2.4s ease-in-out infinite;
  }
  @keyframes rise {
    0%, 100% { transform: translateY(0); opacity: .6; }
    50% { transform: translateY(-4px); opacity: 1; }
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 90px;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 0 var(--line);
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  input[type=text] {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 14px;
    background: var(--cream);
    color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--pot); border-color: var(--pot); }
  button.primary {
    width: 100%;
    background: var(--pot);
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  button.primary:active { background: var(--pot-dark); }
  .recipe-title { font-weight: 700; font-size: 15px; margin: 0 0 6px; }
  .recipe-ing { font-size: 13px; color: #7A6A57; margin: 0 0 6px; }
  .recipe-note {
    background: var(--note);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    margin: 6px 0;
    display: inline-block;
  }
  .add-cart {
    margin-top: 8px;
    background: none;
    border: 1.5px solid var(--pot);
    color: var(--pot-dark);
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .check-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .check-row .box {
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid var(--pot);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff;
  }
  .check-row.done .box { background: var(--leaf); border-color: var(--leaf); }
  .check-row.done span.label { text-decoration: line-through; color: #b3a793; }
  nav.tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    display: flex;
    max-width: 480px;
    margin: 0 auto;
  }
  nav.tabbar button {
    flex: 1;
    background: none;
    border: none;
    padding: 12px 0 10px;
    font-size: 12px;
    color: #B3A793;
    cursor: pointer;
  }
  nav.tabbar button.active { color: var(--pot); font-weight: 700; }
  nav.tabbar .icon { display: block; font-size: 18px; margin-bottom: 2px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .empty {
    text-align: center;
    color: #B3A793;
    font-size: 13px;
    padding: 30px 0;
  }
  #search-input { margin-top: 4px; }
  .status-dot {
    position: fixed; top: 10px; right: 12px;
    font-size: 10px; color: #B3A793;
  }
</style>
</head>
<body>

<header>
  <h1><span class="steam">🍲</span> 보글보글 냠냠수첩</h1>
</header>
<div class="status-dot" id="status">연결 확인 중...</div>

<main>

  <!-- 탭 1: 레시피 등록 & 피드 -->
  <section class="tab-panel active" id="tab-feed">
    <div class="card">
      <h2>✨ 새 레시피 입력</h2>
      <input type="text" id="input-title" placeholder="요리 이름 (예: 차돌된장찌개)">
      <input type="text" id="input-ingredients" placeholder="재료 (쉼표로 구분: 감자, 두부, 파)">
      <input type="text" id="input-note" placeholder="💡 아이용 메모 (예: 간장 1스푼 감량)">
      <button class="primary" id="btn-save">레시피 저장하기</button>
    </div>
    <div id="recipe-list"></div>
  </section>

  <!-- 탭 2: 재료 검색 -->
  <section class="tab-panel" id="tab-search">
    <div class="card">
      <h2>🔍 냉장고 파먹기</h2>
      <input type="text" id="search-input" placeholder="찾고 싶은 재료 입력 (예: 감자)">
    </div>
    <div id="search-results"></div>
  </section>

  <!-- 탭 3: 장보기 -->
  <section class="tab-panel" id="tab-shopping">
    <div class="card">
      <h2>🛒 장보기 리스트</h2>
    </div>
    <div id="shopping-list"></div>
  </section>

</main>

<nav class="tabbar">
  <button data-tab="feed" class="active"><span class="icon">🍳</span>레시피</button>
  <button data-tab="search"><span class="icon">🔍</span>재료검색</button>
  <button data-tab="shopping"><span class="icon">🛒</span>장보기</button>
</nav>

<script>
const SUPABASE_URL = "https://gpphgtdvlcsmjymhhndq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwcGhndGR2bGNzbWp5bWhobmRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDcwNjQsImV4cCI6MjEwMjYyMzA2NH0.ScwRnwp4OGtTSyhXqo1LQ6EnrTcINnLqXWZUALMAO24";

// 변수명을 db로 선언하여 스크립트 충돌을 방지합니다.
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// --- 탭 전환 ---
document.querySelectorAll('nav.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// --- 연결 상태 체크 ---
async function checkConnection() {
  const statusEl = document.getElementById('status');
  const { error } = await db.from('recipes').select('id').limit(1);
  statusEl.textContent = error ? '⚠️ 연결 실패' : '🟢 연결됨';
}

// --- 레시피 불러오기 ---
async function fetchRecipes() {
  const { data, error } = await db
    .from('recipes')
    .select('*, ingredients(*)')
    .order('created_at', { ascending: false });

  const listEl = document.getElementById('recipe-list');
  listEl.innerHTML = '';

  if (error || !data || data.length === 0) {
    listEl.innerHTML = '<div class="empty">아직 등록된 레시피가 없어요 🍳</div>';
    return;
  }

  data.forEach(recipe => {
    const ingNames = (recipe.ingredients || []).map(i => i.name).join(', ');
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <p class="recipe-title">${recipe.title}</p>
      <p class="recipe-ing">🥕 ${ingNames || '재료 없음'}</p>
      ${recipe.kids_note ? `<div class="recipe-note">${recipe.kids_note}</div>` : ''}
      <br>
      <button class="add-cart">🛒 장보기 리스트에 담기</button>
    `;
    card.querySelector('.add-cart').addEventListener('click', () => {
      addToShopping(recipe.ingredients || []);
    });
    listEl.appendChild(card);
  });
}

// --- 레시피 저장 ---
document.getElementById('btn-save').addEventListener('click', async () => {
  const title = document.getElementById('input-title').value.trim();
  const ingredientsText = document.getElementById('input-ingredients').value.trim();
  const note = document.getElementById('input-note').value.trim();

  if (!title) { alert('요리 이름을 입력해주세요!'); return; }

  const { data: recipe, error } = await db
    .from('recipes')
    .insert([{ title, kids_note: note || null }])
    .select()
    .single();

  if (error || !recipe) { alert('저장에 실패했어요. 다시 시도해주세요.'); return; }

  if (ingredientsText) {
    const ingList = ingredientsText.split(',').map(name => ({
      recipe_id: recipe.id,
      name: name.trim(),
    })).filter(i => i.name);
    await db.from('ingredients').insert(ingList);
  }

  document.getElementById('input-title').value = '';
  document.getElementById('input-ingredients').value = '';
  document.getElementById('input-note').value = '';
  fetchRecipes();
});

// --- 재료 검색 ---
document.getElementById('search-input').addEventListener('input', async (e) => {
  const text = e.target.value.trim();
  const resultsEl = document.getElementById('search-results');

  if (!text) { resultsEl.innerHTML = ''; return; }

  const { data, error } = await db
    .from('ingredients')
    .select('name, recipes(*, ingredients(*))')
    .ilike('name', `%${text}%`);

  resultsEl.innerHTML = '';

  if (error || !data || data.length === 0) {
    resultsEl.innerHTML = '<div class="empty">일치하는 레시피가 없어요</div>';
    return;
  }

  const seen = new Set();
  data.forEach(row => {
    const recipe = row.recipes;
    if (!recipe || seen.has(recipe.id)) return;
    seen.add(recipe.id);

    const ingNames = (recipe.ingredients || []).map(i => i.name).join(', ');
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <p class="recipe-title">${recipe.title}</p>
      <p class="recipe-ing">🥕 ${ingNames}</p>
    `;
    resultsEl.appendChild(card);
  });
});

// --- 장보기: 담기 ---
async function addToShopping(ingredients) {
  if (!ingredients.length) { alert('담을 재료가 없어요'); return; }
  const items = ingredients.map(i => ({ name: i.name }));
  await db.from('shopping_list').insert(items);
  fetchShoppingList();
  alert('장보기 리스트에 담았어요! 🛒');
}

// --- 장보기: 불러오기 ---
async function fetchShoppingList() {
  const { data, error } = await db.from('shopping_list').select('*').order('id');
  const listEl = document.getElementById('shopping-list');
  listEl.innerHTML = '';

  if (error || !data || data.length === 0) {
    listEl.innerHTML = '<div class="empty">장보기 리스트가 비어있어요</div>';
    return;
  }

  data.forEach(item => {
    const row = document.createElement('div');
    row.className = 'check-row' + (item.is_checked ? ' done' : '');
    row.innerHTML = `<span class="box">${item.is_checked ? '✓' : ''}</span><span class="label">${item.name}</span>`;
    row.addEventListener('click', async () => {
      await db.from('shopping_list').update({ is_checked: !item.is_checked }).eq('id', item.id);
      fetchShoppingList();
    });
    listEl.appendChild(row);
  });
}

// --- 초기 실행 ---
checkConnection();
fetchRecipes();
fetchShoppingList();
</script>
</body>
</html>
